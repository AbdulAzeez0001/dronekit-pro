[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dronekit-pcb"
version = "0.1.0"
description = "Program a DroneKit Pro quadcopter in Code mode, from Python"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["websockets>=12"]

[tool.setuptools.packages.find]
where = ["src"]
