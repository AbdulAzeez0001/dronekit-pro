; DroneKit Pro - ESP32-S3 firmware (MIT). See README.md.
;
; Build:   pio run
; Flash:   pio run -t upload      (Code mode, USB-C goes to the ESP32-S3)
; Console: pio device monitor

[env:dronekit]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1-N8R2: 8 MB quad flash, 2 MB quad PSRAM.
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv

; Native USB (GPIO19/20) as the serial console.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

monitor_speed = 115200

lib_deps =
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.7.0
    bblanchon/ArduinoJson@^7.2.0
